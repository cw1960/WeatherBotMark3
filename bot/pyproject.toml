[project]
name = "weatherbot-mark3"
version = "0.1.0"
description = "Polymarket weather-market execution daemon (METAR vs HRRR divergence + Jev AFD sentiment, FOK-only)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
